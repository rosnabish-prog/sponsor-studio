name: Probe BuildUp public fixture data
on:
  push:
    paths: ['scripts/probe_source.py', '.github/workflows/probe-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe_source.py
