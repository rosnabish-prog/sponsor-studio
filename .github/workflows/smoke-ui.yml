name: Studio interaction regression
on:
  push:
    paths:
      - index.html
      - src/**
      - public/**
      - package*.json
      - scripts/smoke_ui.cjs
      - .github/workflows/smoke-ui.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend and UI automation dependencies
        run: npm ci
      - name: Test studio interactions and annotation intervals
        run: node scripts/smoke_ui.cjs
