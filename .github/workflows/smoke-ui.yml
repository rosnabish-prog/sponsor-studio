name: Studio interaction regression
on:
  push:
    paths:
      - index.html
      - scripts/smoke_ui.cjs
      - .github/workflows/smoke-ui.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI automation dependency
        run: npm install --no-save jsdom@27
      - name: Test studio interactions and annotation intervals
        run: node scripts/smoke_ui.cjs
