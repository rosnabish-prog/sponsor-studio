name: Sponsor Studio P0 API

on:
  push:
    paths:
      - 'apps/api/**'
      - 'src/api/**'
      - 'src/state/**'
      - 'src/components/**'
      - 'tests/live-api.spec.ts'
      - 'vite.config.ts'
      - 'package*.json'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'package*.json'
      - '.github/workflows/api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sponsor
          POSTGRES_PASSWORD: sponsor_ci
          POSTGRES_DB: sponsor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sponsor -d sponsor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sponsor:sponsor_ci@localhost:5432/sponsor_test?schema=public
      TEST_DATABASE_URL: postgresql://sponsor:sponsor_ci@localhost:5432/sponsor_test?schema=public
      APP_ORIGIN: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate Prisma Client and compile NestJS
        run: npm run build:api
      - name: Apply schema migration to test database
        run: npm run db:deploy
      - name: API unit tests
        run: npm run test:api
      - name: Existing frontend build
        run: npm run build
      - name: Install headless Chromium for live UI integration
        run: npx playwright install --with-deps chromium
      - name: Launch API and production-mode frontend
        run: |
          npm run start --workspace @sponsor-studio/api > "$RUNNER_TEMP/sponsor-api.log" 2>&1 &
          VITE_BACKEND_ENABLED=true npm run dev -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/sponsor-ui.log" 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:3001/api/health || { tail -n 60 "$RUNNER_TEMP/sponsor-api.log"; exit 1; }
          curl --retry 20 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:4173/
      - name: React login, task and annotation integration
        run: npm run test:live
      - name: Upload browser debug trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p0-live-ui-traces
          path: |
            test-results/
            playwright-report/
