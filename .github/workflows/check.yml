name: Check Sponsor Studio

on:
  push:
    paths: ['index.html', 'data/fixtures.json', 'scripts/validate_app.py', '.github/workflows/check.yml']
  workflow_dispatch:

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/validate_app.py
