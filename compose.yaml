services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sponsor
      POSTGRES_PASSWORD: sponsor_local_only
      POSTGRES_DB: sponsor_studio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sponsor_studio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sponsor -d sponsor_studio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sponsor_studio_pg:
